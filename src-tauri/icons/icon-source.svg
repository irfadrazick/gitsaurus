  <g fill="#f3ead2"><rect x="716" y="434" width="14" height="22" rx="5"/><rect x="740" y="428" width="14" height="22" rx="5"/><rect x="692" y="440" width="14" height="22" rx="5"/></g>
  <!-- nostril -->
  
  <ellipse cx="648" cy="336" rx="14" ry="8" fill="#1f7568"/>
</g>
</g>
<rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
</svg>
